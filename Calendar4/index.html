<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matte Slate Calendar</title>
    <style>
        body { 
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #191919; 
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #calendar { zoom: 0.7; }

        table {
            border-collapse: separate;
            border-spacing: 4px;
            background-color: #202020; 
            border-radius: 15px;
            padding: 20px;
            /* Azul fosco e profundo na borda */
            border: 1px solid #2C3E50; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .month { 
            color: #E0E0E0; /* Branco fosco */
            font-size: 1.25em; 
            font-weight: 600;
            text-transform: capitalize;
        }

        .year { 
            font-size: 11px; 
            color: #5B7A96; /* Azul fosco acinzentado */
            font-weight: 500;
            display: block;
            margin-top: 2px;
        }

        .day-header { 
            color: #4A4A4A; 
            font-size: 11px; 
            font-weight: 700;
            text-transform: uppercase;
            padding-bottom: 10px;
            letter-spacing: 0.5px;
        }

        td > span { 
            color: #B0B0B0; /* Cinza claro fosco */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s;
        }

        /* Dia Atual - Prateado Fosco */
        td.avui > span { 
            background-color: #C0C0C0; /* Prata */
            color: #202020 !important; 
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(192, 192, 192, 0.2);
        }

        /* Dias fora do mês */
        td.fora > span { color: #353535; }

        /* Botões em azul fosco */
        .boto-next, .boto-prev {
            background: #2A3B4C;
            color: #C0C0C0;
            border: none;
            border-radius: 6px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .boto-next:hover, .boto-prev:hover {
            background: #34495E;
        }
    </style>
</head>
<body>
    <div id="calendar"></div>

    <script>
        var months = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
        var days_abr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        function calendar(widget, data) {
            widget.innerHTML = '';
            var e = document.createElement('table');
            widget.appendChild(e);

            var headRow = document.createElement('tr');
            var headCell = document.createElement('th');
            headCell.setAttribute('colspan', 7);
            
            var navContainer = document.createElement('div');
            navContainer.className = 'nav-container';

            var boto_prev = document.createElement('button');
            boto_prev.className = 'boto-prev';
            boto_prev.innerHTML = '‹';
            boto_prev.onclick = function() { data.setMonth(data.getMonth() - 1); calendar(widget, new Date(data)); };

            var titleDiv = document.createElement('div');
            titleDiv.className = 'month';
            titleDiv.innerHTML = months[data.getMonth()] + '<span class="year">' + data.getFullYear() + '</span>';

            var boto_next = document.createElement('button');
            boto_next.className = 'boto-next';
            boto_next.innerHTML = '›';
            boto_next.onclick = function() { data.setMonth(data.getMonth() + 1); calendar(widget, new Date(data)); };

            navContainer.appendChild(boto_prev);
            navContainer.appendChild(titleDiv);
            navContainer.appendChild(boto_next);
            headCell.appendChild(navContainer);
            headRow.appendChild(headCell);
            e.appendChild(headRow);

            var fila_dias = document.createElement('tr');
            for (var i = 0; i < 7; i++) {
                fila_dias.innerHTML += '<th class="day-header">' + days_abr[i] + '</th>';
            }
            e.appendChild(fila_dias);

            var inici_mes = new Date(data.getFullYear(), data.getMonth(), 1).getDay();
            var actual = new Date(data.getFullYear(), data.getMonth(), -inici_mes + 1);

            for (var s = 0; s < 6; s++) {
                var nova_fila = document.createElement('tr');
                for (var d = 0; d < 7; d++) {
                    var cela = document.createElement('td');
                    var span = document.createElement('span');
                    span.innerHTML = actual.getDate();
                    if (actual.getMonth() !== data.getMonth()) cela.className = 'fora';
                    if (new Date().toDateString() === actual.toDateString()) cela.className = 'avui';
                    cela.appendChild(span);
                    nova_fila.appendChild(cela);
                    actual.setDate(actual.getDate() + 1);
                }
                e.appendChild(nova_fila);
            }
        }

        calendar(document.getElementById('calendar'), new Date());
    </script>
</body>
</html>
