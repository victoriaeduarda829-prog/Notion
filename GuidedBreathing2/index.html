<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Whimsy - Guided Breathing</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #191919; /* Cor do Notion */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .breathing-container {
            zoom: 0.7;
            background-color: #0b0d16; /* Fundo Meia-Noite Profundo */
            border-radius: 12px;
            width: 340px;
            height: 320px;
            padding: 24px 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(102, 129, 155, 0.15); /* Borda fina no seu azul fosco */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .widget-header {
            width: 100%;
            text-align: left;
            border-bottom: 1px solid rgba(102, 129, 155, 0.1);
            padding-bottom: 10px;
        }
        .widget-title {
            font-family: 'Playfair Display', 'Georgia', serif; /* Toque elegante gótico */
            color: #a9b3be; /* Cinza-azulado lunar */
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .animation-circle-space {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }
        .breathing-circle {
            width: 60px;
            height: 60px;
            background-color: #131726;
            border: 2px solid #66819b; /* Seu azul principal */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(102, 129, 155, 0.1);
            transition: all 4s ease-in-out;
        }
        .breathing-circle.inhale {
            width: 140px;
            height: 140px;
            background-color: #1c2336; /* Expande para um tom azulado névoa */
            border-color: #66819b;
            box-shadow: 0 0 35px rgba(102, 129, 155, 0.25); /* Brilho de eclipse frio */
        }
        .breathing-text {
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            text-align: center;
        }
        .control-btn {
            background: transparent;
            color: #a9b3be;
            border: 1px solid rgba(102, 129, 155, 0.2);
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s ease;
            width: 60%;
        }
        .control-btn:hover {
            background-color: rgba(102, 129, 155, 0.1);
            border-color: #66819b;
            color: #ffffff;
        }
        .control-btn.active {
            background-color: #131726;
            color: #ffffff;
            border-color: #66819b;
        }
    </style>
</head>
<body>
    <div class="breathing-container">
        <div class="widget-header">
            <div class="widget-title">Ritual of Breath</div>
        </div>
        <div class="animation-circle-space">
            <div class="breathing-circle" id="circle">
                <div class="breathing-text" id="text">Ready</div>
            </div>
        </div>
        <button class="control-btn" id="trigger-btn" onclick="toggleBreathing()">Begin</button>
    </div>
    <script>
        let isBreathing = false;
        let breathingInterval;
        const circle = document.getElementById('circle');
        const text = document.getElementById('text');
        const btn = document.getElementById('trigger-btn');

        function toggleBreathing() {
            if (isBreathing) {
                clearInterval(breathingInterval);
                isBreathing = false;
                circle.classList.remove('inhale');
                text.textContent = 'Ready';
                btn.textContent = 'Begin';
                btn.classList.remove('active');
            } else {
                isBreathing = true;
                btn.textContent = 'Pause';
                btn.classList.add('active');
                runCycle();
                breathingInterval = setInterval(runCycle, 4000);
            }
        }
        function runCycle() {
            if (circle.classList.contains('inhale')) {
                circle.classList.remove('inhale');
                text.textContent = 'Exhale';
            } else {
                circle.classList.add('inhale');
                text.textContent = 'Inhale';
            }
        }
    </script>
</body>
</html>
