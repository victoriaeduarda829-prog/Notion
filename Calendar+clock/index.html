<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Whimsy Calendar</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #191919;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #calendar {
            zoom: 0.65;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            background-color: #0b0d16; /* Roxo/Azul Meia-Noite Profundo */
            border-radius: 12px; /* Cantos levemente mais retos/góticos */
            overflow: hidden;
            width: 340px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.15); /* Fina borda ouro velho */
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(180deg, #131726 0%, #0b0d16 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }
        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .month {
            font-family: 'Playfair Display', 'Georgia', serif; /* Fonte Whimsy Gothic */
            color: #d4af37; /* Ouro Velho das estrelas */
            font-size: 1.35em;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 1px;
        }
        .year {
            font-size: 0.85em;
            color: #a9b3be;
            font-weight: 600;
            opacity: 0.5;
            letter-spacing: 2px;
        }
        .digital-clock {
            font-size: 0.9em;
            color: #66819b; /* O seu azul noturno de volta */
            font-weight: 700;
            letter-spacing: 1.5px;
            font-variant-numeric: tabular-nums;
            margin-top: 4px;
        }
        .day-header {
            background-color: rgba(102, 129, 155, 0.03);
            color: #a9b3be; /* Seu cinza-azulado */
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 14px 0 10px 0;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        td {
            padding: 6px 4px;
            text-align: center;
        }
        td > span {
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s ease;
        }
        td:not(.fora):not(.avui) > span:hover {
            background-color: rgba(212, 175, 55, 0.1); /* Brilho estelar no hover */
            color: #d4af37;
            cursor: pointer;
        }
        td.avui > span {
            background-color: #66819b; /* Seu azul destacando o hoje */
            color: #ffffff !important;
            font-weight: 800;
            border: 1px solid #d4af37; /* Circundado em ouro */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        td.fora > span {
            color: #1a1f33; /* Dias sumindo na névoa da noite */
        }
        .boto-next, .boto-prev {
            background: transparent;
            color: #a9b3be;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .boto-next:hover, .boto-prev:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border-color: #d4af37;
        }
    </style>
</head>
<body>
    <div id="calendar"></div>
    <script>
        var months = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
        var days_abr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var currentDatePointer = new Date();

        function updateClock() {
            var clockEl = document.getElementById('live-clock');
            if (clockEl) {
                var now = new Date();
                clockEl.innerHTML = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
            }
        }

        function calendar(widget, data) {
            widget.innerHTML = '';
            var e = document.createElement('table');
            widget.appendChild(e);

            var headRow = document.createElement('tr');
            var headCell = document.createElement('th');
            headCell.setAttribute('colspan', 7);
            var navContainer = document.createElement('div');
            navContainer.className = 'nav-container';

            var boto_prev = document.createElement('button');
            boto_prev.className = 'boto-prev';
            boto_prev.innerHTML = '‹';
            boto_prev.onclick = function() { currentDatePointer.setMonth(currentDatePointer.getMonth() - 1); calendar(widget, currentDatePointer); };

            var headerCenter = document.createElement('div');
            headerCenter.className = 'header-center';

            var titleDiv = document.createElement('div');
            titleDiv.className = 'month';
            titleDiv.innerHTML = months[data.getMonth()] + ' <span class="year">' + data.getFullYear() + '</span>';

            var clockDiv = document.createElement('div');
            clockDiv.className = 'digital-clock';
            clockDiv.id = 'live-clock';

            headerCenter.appendChild(titleDiv);
            headerCenter.appendChild(clockDiv);

            var boto_next = document.createElement('button');
            boto_next.className = 'boto-next';
            boto_next.innerHTML = '›';
            boto_next.onclick = function() { currentDatePointer.setMonth(currentDatePointer.getMonth() + 1); calendar(widget, currentDatePointer); };

            navContainer.appendChild(boto_prev);
            navContainer.appendChild(headerCenter);
            navContainer.appendChild(boto_next);
            headCell.appendChild(navContainer);
            headRow.appendChild(headCell);
            e.appendChild(headRow);

            var fila_dias = document.createElement('tr');
            for (var i = 0; i < 7; i++) { fila_dias.innerHTML += '<th class="day-header">' + days_abr[i] + '</th>'; }
            e.appendChild(fila_dias);

            var inici_mes = new Date(data.getFullYear(), data.getMonth(), 1).getDay();
            var actual = new Date(data.getFullYear(), data.getMonth(), -inici_mes + 1);
            
            for (var s = 0; s < 6; s++) {
                var nova_fila = document.createElement('tr');
                for (var d = 0; d < 7; d++) {
                    var cela = document.createElement('td');
                    var span = document.createElement('span');
                    span.innerHTML = actual.getDate();

                    if (actual.getMonth() !== data.getMonth()) { cela.className = 'fora'; }
                    if (new Date().toDateString() === actual.toDateString()) { cela.className = 'avui'; }

                    cela.appendChild(span);
                    nova_fila.appendChild(cela);
                    actual.setDate(actual.getDate() + 1);
                }
                e.appendChild(nova_fila);
            }
            updateClock();
        }

        calendar(document.getElementById('calendar'), currentDatePointer);
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
