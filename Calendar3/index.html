<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Calendar Widget</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #0f111a; /* Fundo idêntico ao dark mode profundo do Notion */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #calendar {
            zoom: 0.7;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            background-color: #1a1d29; /* Azul meia-noite fechado */
            border-radius: 20px;
            overflow: hidden;
            width: 340px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(180deg, #1e2235 0%, #1a1d29 100%);
        }
        .month {
            color: #ffffff;
            font-size: 1.3em;
            font-weight: 800;
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .year {
            font-size: 1em;
            color: #4f5b7c; /* Azul acinzentado sutil */
            font-weight: 600;
        }
        .day-header {
            background-color: rgba(255, 255, 255, 0.02);
            color: #51628d; /* Azul muted para os dias da semana */
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            letter-spacing: 1px;
        }
        td {
            padding: 6px 4px;
            text-align: center;
        }
        td > span {
            color: #a6b2d1; /* Azul elétrico bem claro/desbotado para leitura */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        /* Efeito de brilho de neon sutil ao passar o mouse */
        td:not(.fora):not(.avui) > span:hover {
            background-color: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            cursor: pointer;
        }
        td.avui > span {
            background-color: #00d4ff; /* Azul Ciano Neon (A hora mais brilhante da noite) */
            color: #0f111a !important;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }
        td.fora > span {
            color: #31384e; /* Sumegindo no fundo escuro */
        }
        .boto-next, .boto-prev {
            background: #252a3c;
            color: #a6b2d1;
            border: none;
            border-radius: 10px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .boto-next:hover, .boto-prev:hover {
            background: #00d4ff;
            color: #0f111a;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }
    </style>
</head>
<body>
    <div id="calendar"></div>
    <script>
        var months = [
            'january', 'february', 'march', 'april', 'may', 'june',
            'july', 'august', 'september', 'october', 'november', 'december'
        ];
        var days_abr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        
        var currentDatePointer = new Date();

        function calendar(widget, data) {
            widget.innerHTML = '';
            var e = document.createElement('table');
            widget.appendChild(e);

            var headRow = document.createElement('tr');
            var headCell = document.createElement('th');
            headCell.setAttribute('colspan', 7);
            var navContainer = document.createElement('div');
            navContainer.className = 'nav-container';

            var boto_prev = document.createElement('button');
            boto_prev.className = 'boto-prev';
            boto_prev.innerHTML = '‹';
            boto_prev.onclick = function() {
                currentDatePointer.setMonth(currentDatePointer.getMonth() - 1);
                calendar(widget, currentDatePointer);
            };

            var titleDiv = document.createElement('div');
            titleDiv.className = 'month';
            titleDiv.innerHTML = months[data.getMonth()] + ' <span class="year">' + data.getFullYear() + '</span>';

            var boto_next = document.createElement('button');
            boto_next.className = 'boto-next';
            boto_next.innerHTML = '›';
            boto_next.onclick = function() {
                currentDatePointer.setMonth(currentDatePointer.getMonth() + 1);
                calendar(widget, currentDatePointer);
            };

            navContainer.appendChild(boto_prev);
            navContainer.appendChild(titleDiv);
            navContainer.appendChild(boto_next);
            headCell.appendChild(navContainer);
            headRow.appendChild(headCell);
            e.appendChild(headRow);

            var fila_dias = document.createElement('tr');
            for (var i = 0; i < 7; i++) {
                fila_dias.innerHTML += '<th class="day-header">' + days_abr[i] + '</th>';
            }
            e.appendChild(fila_dias);

            var inici_mes = new Date(data.getFullYear(), data.getMonth(), 1).getDay();
            var actual = new Date(data.getFullYear(), data.getMonth(), -inici_mes + 1);
            
            for (var s = 0; s < 6; s++) {
                var nova_fila = document.createElement('tr');
                for (var d = 0; d < 7; d++) {
                    var cela = document.createElement('td');
                    var span = document.createElement('span');
                    span.innerHTML = actual.getDate();

                    if (actual.getMonth() !== data.getMonth()) {
                        cela.className = 'fora';
                    }
                    if (new Date().toDateString() === actual.toDateString()) {
                        cela.className = 'avui';
                    }

                    cela.appendChild(span);
                    nova_fila.appendChild(cela);
                    actual.setDate(actual.getDate() + 1);
                }
                e.appendChild(nova_fila);
            }
        }

        calendar(document.getElementById('calendar'), currentDatePointer);
    </script>
</body>
</html>
