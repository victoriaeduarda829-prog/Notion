<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Notion Countdown</title>
    <style>
        body { 
            background: #191919; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Lato', sans-serif; 
        }

        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; 
            zoom: 0.8; 
        }

        .title {
            color: #FFFFFF; /* Título branco como pedido */
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            text-align: center;
        }
        
        #timer { 
            text-align: center; 
            text-transform: uppercase; 
            font-size: .5em; 
            letter-spacing: 1px; 
            display: flex; 
            gap: 6px; 
        }

        .unit { 
            padding: 10px 6px; 
            width: 52px; 
            border-radius: 6px; 
        }

        /* Aplicação da sua nova paleta de cores */
        .months { background: #1B3C53; color: #F9F3EF; }
        .weeks { background: #456882; color: #F9F3EF; }
        .days { background: #D2C1B6; color: #1B3C53; }

        .numbers { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 1.7em; 
            display: block; 
            margin-bottom: 0px; 
        }

        .finished-text {
            color: #FFFFFF;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="container">
    <div class="title">A Grande Prova 🎯</div>
    
    <div id="timer">
        <div class="unit months"><span id="months" class="numbers">0</span> meses</div>
        <div class="unit weeks"><span id="weeks" class="numbers">0</span> sem</div>
        <div class="unit days"><span id="days" class="numbers">0</span> dias</div>
    </div>
</div>

<script>
    // Data configurada para 08 de Novembro de 2026 (Mês 10 no JS pois começa em 0)
    const targetDate = new Date(2026, 10, 8, 0, 0, 0); 

    function updateTimer() {
        const now = new Date();
        
        // Zera as horas de 'now' para focar apenas nos dias inteiros restantes
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffMs = targetDate - today;

        if (diffMs <= 0) {
            const timerElement = document.getElementById("timer");
            if (timerElement) {
                timerElement.outerHTML = `
                    <div class="finished-text">Chegou o dia! Confie no seu processo! 🧠✨</div>
                `;
            }
            return;
        }

        // Cálculo de meses inteiros considerando os dias do calendário
        let months = (targetDate.getFullYear() - today.getFullYear()) * 12 + (targetDate.getMonth() - today.getMonth());
        
        let tempDate = new Date(today);
        tempDate.setMonth(tempDate.getMonth() + months);
        if (tempDate > targetDate) {
            months--;
            tempDate = new Date(today);
            tempDate.setMonth(tempDate.getMonth() + months);
        }

        // Restante do tempo convertido em semanas e dias
        const remainingMs = targetDate - tempDate;
        const weeks = Math.floor(remainingMs / 604800000);
        const days = Math.floor((remainingMs % 604800000) / 86400000);

        document.getElementById("months").innerText = months;
        document.getElementById("weeks").innerText = weeks;
        document.getElementById("days").innerText = days;
    }

    // Verifica a cada minuto se o dia mudou para atualizar a contagem
    const timerInterval = setInterval(() => {
        const now = new Date();
        if (targetDate - now <= 0) {
            updateTimer();
            clearInterval(timerInterval);
        } else {
            updateTimer();
        }
    }, 60000);
    
    updateTimer();
</script>
</body>
</html>
