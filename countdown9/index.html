<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Notion Countdown</title>
    <style>
        body { 
            background: #191919; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Lato', sans-serif; 
        }

        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; 
            zoom: 1.0; 
        }

        .title {
            color: #FFFFFF;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            text-align: center;
        }
        
        #timer { 
            text-align: center; 
            text-transform: uppercase; 
            font-size: .5em; 
            letter-spacing: 1px; 
            display: flex; 
            gap: 6px; 
        }

        .unit { 
            padding: 10px 6px; 
            width: 52px; 
            border-radius: 6px; 
        }

        /* Distribuição da paleta de cores incluindo as horas */
        .months { background: #1B3C53; color: #F9F3EF; }
        .weeks { background: #456882; color: #F9F3EF; }
        .days { background: #D2C1B6; color: #1B3C53; }
        .hours { background: #F9F3EF; color: #1B3C53; }

        .numbers { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 1.7em; 
            display: block; 
            margin-bottom: 0px; 
        }

        .finished-text {
            color: #FFFFFF;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="container">
    <div class="title">Até aquela prova</div>
    
    <div id="timer">
        <div class="unit months"><span id="months" class="numbers">0</span> meses</div>
        <div class="unit weeks"><span id="weeks" class="numbers">0</span> sem</div>
        <div class="unit days"><span id="days" class="numbers">0</span> dias</div>
        <div class="unit hours"><span id="hours" class="numbers">0</span> horas</div>
    </div>
</div>

<script>
    // Configurado para o início do dia 08 de Novembro de 2026 (Meia-noite)
    const targetDate = new Date(2026, 10, 8, 0, 0, 0); 

    function updateTimer() {
        const now = new Date();
        const diffMs = targetDate - now;

        if (diffMs <= 0) {
            const timerElement = document.getElementById("timer");
            if (timerElement) {
                timerElement.outerHTML = `
                    <div class="finished-text">É hoje bb. Só tenta não pirar.</div>
                `;
            }
            return;
        }

        // Cálculo de meses inteiros a partir do momento atual
        let months = (targetDate.getFullYear() - now.getFullYear()) * 12 + (targetDate.getMonth() - now.getMonth());
        
        let tempDate = new Date(now);
        tempDate.setMonth(tempDate.getMonth() + months);
        if (tempDate > targetDate) {
            months--;
            tempDate = new Date(now);
            tempDate.setMonth(tempDate.getMonth() + months);
        }

        // Restante do tempo exato após subtrair os meses inteiros
        const remainingMs = targetDate - tempDate;
        
        // Conversão precisa em semanas, dias e horas restantes
        const weeks = Math.floor(remainingMs / 604800000);
        const days = Math.floor((remainingMs % 604800000) / 86400000);
        const hours = Math.floor((remainingMs % 86400000) / 3600000);

        document.getElementById("months").innerText = months;
        document.getElementById("weeks").innerText = weeks;
        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = hours;
    }

    // Mantido o intervalo de 1 minuto para atualizar a transição das horas perfeitamente
    const timerInterval = setInterval(() => {
        const now = new Date();
        if (targetDate - now <= 0) {
            updateTimer();
            clearInterval(timerInterval);
        } else {
            updateTimer();
        }
    }, 60000);
    
    updateTimer();
</script>
</body>
</html>
